[package]
name = "recast"
version = "0.1.0"
edition = "2021"

# Smaller, faster release binary — the embedded dictionaries dominate size,
# but LTO + a single codegen unit still shave several MB and help the hot
# dictionary-lookup path.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
dirs = "4.0"
nix = { version = "0.27", features = ["process", "fs"] }
crossterm = "0.28"
ratatui = { version = "0.26", features = ["crossterm"] }
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
rdev = "0.5.3"
core-foundation = "0.9"
core-foundation-sys = "0.8"
tray-icon = "0.24"
tao = "0.35"
cocoa = "0.24"
objc = "0.2"  # needed for raw msg_send! to NSAlert (cocoa 0.24 does not expose NSAlert); see src/platform/tray.rs

[target.'cfg(target_os = "windows")'.dependencies]
rdev = "0.5.3"
tray-icon = "0.24"
tao = "0.35"
winapi = { version = "0.3", features = ["winuser", "windef"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }