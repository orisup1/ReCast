<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReCast menubar template">
  <!-- Template: solid black keycap with the two swap arrows knocked out, so
       macOS can tint it for light/dark menubars. White in the mask = kept,
       black in the mask = removed. Tilted to match the app icon. -->
  <mask id="knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <g transform="rotate(-7 128 128)">
      <rect x="44" y="42" width="168" height="172" rx="36" fill="#FFFFFF"/>
      <g stroke="#000000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- top arc: over the top, head tangent (points down) -->
        <path d="M97 110 A36 36 0 0 1 159 110"/>
        <polyline points="141,111 164,118 169,95"/>
        <!-- bottom arc: under the bottom, head tangent (points up) -->
        <path d="M159 146 A36 36 0 0 1 97 146"/>
        <polyline points="115,145 92,138 87,161"/>
      </g>
    </g>
  </mask>
  <rect x="0" y="0" width="256" height="256" fill="#000000" mask="url(#knockout)"/>
</svg>
